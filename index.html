<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <meta name="apple-mobile-web-app-capable" content=yes>
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07111f">

    <title>Live Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            margin: 0;
            height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at center, #202124 0%, #121213 60%, #090909 100%);

            color: white;
        }

        .clock-container {
            text-align: center;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 20px;

            padding: 40px 60px;

            box-shadow:
                0 0 40px rgba(83, 141, 78, 0.15),
                inset 0 0 20px rgba(255, 255, 255, 0.02);

            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 16px;
            letter-spacing: 5px;
            color: #888;

            margin-bottom: 15px;
        }

        #clock {
            font-size: 80px;
            font-weight: bold;

            letter-spacing: 4px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 25px rgba(83, 141, 78, 0.4);
        }

        #date {
            margin-top: 15px;

            font-size: 18px;

            color: #aaaaaa;

            letter-spacing: 2px;
        }

        /* Make the clock smaller on phones */
        @media (max-width: 600px) {

            .clock-container {
                padding: 30px 20px;
                width: 90%;
            }

            #clock {
                font-size: 45px;
                letter-spacing: 2px;
            }

            #date {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="clock-container">

        <div class="title">
            CURRENT TIME
        </div>

        <div id="clock">
            12:00:00 AM
        </div>

        <div id="date">
            Loading...
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
